<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Library</title>

<style>
body{
  font-family:Arial;
  background:linear-gradient(120deg,#f1f5f9,#e2e8f0);
  padding:10px;
}

h1{
  text-align:center;
  color:#111;
}

.buttons{
  text-align:center;
  margin-bottom:15px;
}

button{
  padding:8px 12px;
  margin:5px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:#1f2937;
  color:white;
}

button:hover{
  opacity:0.8;
}

.book{
  background:#2563eb;
  color:white;
  padding:12px;
  margin:6px 0;
  border-radius:8px;
  cursor:pointer;
}

.book:hover{
  opacity:0.85;
}
</style>
</head>

<body>

<h1>Book Library</h1>

<div class="buttons">
  <button onclick="filter('all')">All</button>
  <button onclick="filter('romance')">Romance</button>
  <button onclick="filter('crime')">Crime</button>
  <button onclick="filter('horror')">Horror</button>
  <button onclick="filter('sci-fi')">Sci-Fi</button>
  <button onclick="filter('children')">Children</button>
  <button onclick="filter('general')">General</button>
</div>

<div id="list"></div>

<script>

const list = document.getElementById("list");

let books = [];

/* فلترة كتب بدون دين */
const banned = [
  "religion","islam","quran","bible","god",
  "jesus","faith","church","mosque","prophet"
];

/* جلب الكتب */
async function load(){
  const res = await fetch("https://gutendex.com/books/?page=1");
  const data = await res.json();

  books = data.results
    .filter(b=>{
      const text = (b.title + " " + (b.subjects||[]).join(" ")).toLowerCase();
      if(banned.some(w=>text.includes(w))) return false;

      return b.formats["text/html; charset=utf-8"];
    })
    .map(b=>({
      title:b.title,
      author:(b.authors.map(a=>a.name).join(", ")||"Unknown"),
      url:b.formats["text/html; charset=utf-8"],
      category:detectCategory(b.subjects || [])
    }));

  show(books);
}

/* تحديد الفئة */
function detectCategory(subjects){
  const s = subjects.join(" ").toLowerCase();

  if(s.includes("love")) return "romance";
  if(s.includes("crime")) return "crime";
  if(s.includes("horror")) return "horror";
  if(s.includes("science") || s.includes("space")) return "sci-fi";
  if(s.includes("children")) return "children";

  return "general";
}

/* عرض */
function show(data){
  list.innerHTML="";

  data.forEach(b=>{
    const div=document.createElement("div");
    div.className="book";
    div.innerHTML=`<b>${b.title}</b><br>${b.author}`;
    div.onclick=()=>window.open(b.url,"_blank");
    list.appendChild(div);
  });
}

/* فلترة */
function filter(type){
  if(type==="all") return show(books);

  const filtered = books.filter(b=>b.category===type);
  show(filtered);
}

load();

</script>

</body>
</html>
