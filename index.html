<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Book Hub</title>

<style>
body{
  font-family:Arial;
  margin:0;
  background:linear-gradient(120deg,#0f172a,#111827);
  color:white;
}

header{
  text-align:center;
  padding:20px;
  font-size:22px;
  font-weight:bold;
}

.container{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  padding:10px;
}

.panel{
  background:rgba(255,255,255,0.05);
  border-radius:12px;
  padding:10px;
  height:85vh;
  overflow:auto;
}

input, textarea{
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-bottom:10px;
}

.book{
  background:#2563eb;
  margin:5px 0;
  padding:10px;
  border-radius:8px;
  cursor:pointer;
}

.book:hover{opacity:0.8;}

.aiBox{
  background:#111827;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

.userMsg{
  color:#60a5fa;
}

.aiMsg{
  color:#34d399;
}
</style>
</head>

<body>

<header>AI BOOK HUB</header>

<div class="container">

<!-- LIBRARY -->
<div class="panel">

<h3>📚 Library</h3>

<input id="search" placeholder="Search books...">

<div id="books"></div>

</div>

<!-- AI -->
<div class="panel">

<h3>🧠 AI Assistant</h3>

<div id="chat"></div>

<textarea id="prompt" placeholder="Ask AI: recommend books, topics, learning paths..."></textarea>
<button onclick="askAI()">Ask AI</button>

</div>

</div>

<script>

const booksDiv = document.getElementById("books");
const chat = document.getElementById("chat");

let books = [];

/* فلترة بسيطة */
const banned = ["religion","islam","quran","bible","god","jesus","faith","church"];

/* تحميل الكتب */
async function loadBooks(){
  const res = await fetch("https://gutendex.com/books/?page=1");
  const data = await res.json();

  books = data.results.filter(b=>{
    const text = (b.title + " " + (b.subjects||[]).join(" ")).toLowerCase();
    if(banned.some(w=>text.includes(w))) return false;

    return b.formats["text/html; charset=utf-8"];
  }).map(b=>({
    title:b.title,
    author:(b.authors.map(a=>a.name).join(", ")||"Unknown"),
    url:b.formats["text/html; charset=utf-8"]
  }));

  renderBooks(books);
}

/* عرض الكتب */
function renderBooks(list){
  booksDiv.innerHTML = "";

  list.forEach(b=>{
    const div = document.createElement("div");
    div.className="book";
    div.innerHTML = `<b>${b.title}</b><br>${b.author}`;
    div.onclick = ()=>window.open(b.url,"_blank");
    booksDiv.appendChild(div);
  });
}

/* بحث ذكي */
document.getElementById("search").addEventListener("input",(e)=>{
  const q = e.target.value.toLowerCase();

  const filtered = books.filter(b=>{
    return b.title.toLowerCase().includes(q) ||
           b.author.toLowerCase().includes(q) ||
           smartMatch(q,b.title);
  });

  renderBooks(filtered);
});

/* AI بسيط (بدون API) */
function askAI(){
  const input = document.getElementById("prompt").value;
  if(!input) return;

  addMsg("user",input);

  let response = "";

  if(input.includes("programming")){
    response = "Try: JavaScript basics, Python for beginners, Web development.";
  }
  else if(input.includes("science")){
    response = "Try: Physics fundamentals, Chemistry basics, Biology intro.";
  }
  else if(input.includes("history")){
    response = "Try: World history, Ancient civilizations, Modern history.";
  }
  else{
    response = "I recommend exploring science, programming, and self-development books.";
  }

  addMsg("ai",response);
  document.getElementById("prompt").value="";
}

/* رسائل */
function addMsg(type,text){
  const div = document.createElement("div");
  div.className = "aiBox";
  div.innerHTML = `<div class="${type==='user'?'userMsg':'aiMsg'}">${text}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

/* ذكاء بسيط في المطابقة */
function smartMatch(q,title){
  return title.toLowerCase().split(" ").some(w=>w.startsWith(q));
}

loadBooks();

</script>

</body>
</html>
